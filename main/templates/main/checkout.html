{% extends 'main/layout.html' %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4">Оформлення замовлення</h2>

    <form method="POST" action="{% url 'create_order' %}">
        {% csrf_token %}

        <div class="row">
            <!-- Ліва колонка: Контактні дані та доставка -->
            <div class="col-md-7">
                <div class="card p-4 shadow-sm mb-4">
                    <h4>1. Контактні дані</h4>
                    <div class="mb-3">
                        <label for="first_name" class="form-label">Ім'я</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="+380..." required>
                    </div>
                </div>

                <div class="card p-4 shadow-sm mb-4">
                    <h4>2. Спосіб доставки</h4>

                    <!-- Радіокнопки вибору доставки -->
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="delivery_service" id="np" value="nova_poshta" checked>
                        <label class="form-check-label" for="np">
                            Нова Пошта (у відділення або поштомат)
                        </label>
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="delivery_service" id="up" value="ukr_poshta">
                        <label class="form-check-label" for="up">
                            Укрпошта
                        </label>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="delivery_service" id="pickup" value="pickup">
                        <label class="form-check-label" for="pickup">
                            Самовивіз (м. Луцьк, вул. Прикладна, 12)
                        </label>
                    </div>

                    <!-- Поля для адреси/відділення -->
                    <div class="mb-3">
                        <label for="city" class="form-label">Місто</label>
                        <input type="text" class="form-control" id="city" name="city">
                    </div>
                    <div class="mb-3">
                        <label for="department" class="form-label">Номер відділення або адреса</label>
                        <input type="text" class="form-control" id="department" name="department">
                    </div>
                </div>
            </div>

            <!-- Права колонка: Оплата та кнопка підтвердження -->
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h4>3. Оплата</h4>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="payment_type" id="cash" value="cash" checked>
                        <label class="form-check-label" for="cash">
                            Післяплата (при отриманні)
                        </label>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="radio" name="payment_type" id="online" value="online">
                        <label class="form-check-label" for="online">
                            Оплата карткою онлайн (WayForPay)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2">Підтвердити замовлення</button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
