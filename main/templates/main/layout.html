{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Власні стилі -->
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
</head>
<body class="bg-dark text-white">

    <!-- Шапка сайту: логотип зліва, а кнопки передаватимуться через блок -->
    <header class="py-3 px-4 border-bottom border-secondary bg-black d-flex justify-content-between align-items-center">
        <!-- Логотип зліва -->
        <a class="d-inline-flex align-items-center text-decoration-none" href="{% url 'home' %}">
            <img src="{% static 'main/logo/logo.png' %}" alt="Logo" class="site-logo me-2">
            <span class="logo-text fw-bold fs-4 text-white">Shop</span>
        </a>

        <!-- Блок для кнопок навігації вгорі праворуч -->
        <div>
            {% block header_buttons %}{% endblock %}
        </div>
    </header>

    <!-- Основний контент сторінок -->
    <div class="container my-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
